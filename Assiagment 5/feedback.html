<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedbackApp</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 30px 16px;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #263238;
        }
        .container {
            max-width: 560px;
            margin: 25px auto;
            padding: 30px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 5px 22px rgba(0,0,0,.08);
        }
        h1 { margin-top: 0; color: #1769aa; text-align: center; }
        p.intro { text-align: center; color: #607080; margin-bottom: 25px; }
        label { display: block; margin: 16px 0 7px; font-weight: bold; }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd5df;
            border-radius: 7px;
            font: inherit;
        }
        textarea { min-height: 120px; resize: vertical; }
        input:focus, select:focus, textarea:focus {
            outline: 2px solid #b8d9f5;
            border-color: #1769aa;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: 0;
            border-radius: 7px;
            background: #1769aa;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #0e5289; }
    </style>
</head>
<body>
    <main class="container">
        <h1>Feedback Form</h1>
        <p class="intro">We value your feedback. Please share your experience.</p>

        <form action="submitFeedback" method="post">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required maxlength="100"
                   placeholder="Enter your name">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required maxlength="150"
                   placeholder="Enter your email address">

            <label for="feedbackType">Feedback Type</label>
            <select id="feedbackType" name="feedbackType" required>
                <option value="">-- Select feedback type --</option>
                <option value="Complaint">Complaint</option>
                <option value="Suggestion">Suggestion</option>
                <option value="Compliment">Compliment</option>
            </select>

            <label for="comments">Comments</label>
            <textarea id="comments" name="comments" required maxlength="2000"
                      placeholder="Write your feedback here"></textarea>

            <button type="submit">Submit Feedback</button>
        </form>
    </main>
</body>
</html>
